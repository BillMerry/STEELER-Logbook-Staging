name: Test Testbed candidate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tests/check-assets.cjs
      - run: npm run test:dom
      - run: npm run test:enrichment
      - run: npx playwright install --with-deps chromium webkit
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          npm test
          node tests/enrichment-browser.cjs
          BROWSER_ENGINE=webkit npm test
          BROWSER_ENGINE=webkit node tests/enrichment-browser.cjs
          BROWSER_ENGINE=webkit node tests/undo-layout-browser.cjs
          BROWSER_ENGINE=webkit node tests/batch-browser.cjs
          BROWSER_ENGINE=webkit node tests/entry-weather-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: oob-preview
          path: test-results/*.png
